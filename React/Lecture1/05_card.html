<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reusable task</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function Card(props) {
        return (
          <div
            style={{
              border: "1px solid gray",
              borderRadius: "10px",
              padding: "10px",
              margin: "10px",
              backgroundColor: "lightgray",
            }}
          >
            <h2>{props.title}</h2>
            <p>{props.desc}</p>
            <p>
              <strong>{props.price}</strong>
            </p>
          </div>
        );
      }

      function App() {
        const courses = [
          { id: 1, title: "React", desc: "library for UI", price: 999 },
          { id: 2, title: "Node", desc: "Backend Runtime", price: 799 },
          { id: 3, title: "MongoDB", desc: "Database", price: 699 },
        ];

        return (
          <div>
            {courses.map((course, index) => (
              <Card
                title={course.title}
                desc={course.desc}
                price={course.price}
              />
            ))}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
